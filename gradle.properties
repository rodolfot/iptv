org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Local Windows fallback: build from terminal using Android Studio's bundled JBR when
# JAVA_HOME is not set. CI sets JAVA_HOME via setup-java, so it ignores this on Linux.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Where the in-app auto-updater looks for new GitHub Releases. Override at
# build time with `-PUPDATE_REPO_OWNER=...` / `-PUPDATE_REPO_NAME=...`. The
# release CI sets these automatically from the GitHub context, so changing
# here only matters for local release builds.
UPDATE_REPO_OWNER=rodolfot
UPDATE_REPO_NAME=iptv
