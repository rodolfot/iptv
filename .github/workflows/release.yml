name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3). Leave empty for the current commit."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tags are required for `git describe` to produce the version name
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O padrão da v3 ("tools platform-tools") quebra com o cmdline-tools
          # 16.0 das imagens atuais do runner: o pacote legado "tools" não
          # existe mais e o sdkmanager sai com erro antes do build.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Strip Windows-only JBR override
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF##*/}"
          fi
          NAME="${TAG#v}"
          # versionCode = number of commits, matches gradle default.
          CODE=$(git rev-list --count HEAD)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          UPDATE_REPO_OWNER: ${{ github.repository_owner }}
          UPDATE_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ARGS="-PVERSION_NAME=${{ steps.ver.outputs.name }} -PVERSION_CODE=${{ steps.ver.outputs.code }}"
          ARGS="$ARGS -PUPDATE_REPO_OWNER=$UPDATE_REPO_OWNER -PUPDATE_REPO_NAME=$UPDATE_REPO_NAME"
          if [ -n "$RELEASE_KEYSTORE_FILE" ]; then
            ARGS="$ARGS -PRELEASE_KEYSTORE_FILE=$RELEASE_KEYSTORE_FILE"
            ARGS="$ARGS -PRELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            ARGS="$ARGS -PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            ARGS="$ARGS -PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          fi
          ./gradlew :app:assembleRelease $ARGS --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             tartatv-${{ steps.ver.outputs.name }}.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TartaTV ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: tartatv-${{ steps.ver.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
