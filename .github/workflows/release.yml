name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3). Leave empty for the current commit."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tags are required for `git describe` to produce the version name
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O padrão da v3 ("tools platform-tools") quebra com o cmdline-tools
          # 16.0 das imagens atuais do runner: o pacote legado "tools" não
          # existe mais e o sdkmanager sai com erro antes do build.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Strip Windows-only JBR override
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      # Sem a chave permanente o Gradle assinaria com a chave de debug do
      # runner, gerada do zero a cada execução — cada release sairia com uma
      # assinatura diferente e nenhuma instalaria por cima da anterior. (O
      # `if: env.X` antigo nunca enxergava o secret e o passo era pulado.)
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 ausente: a release precisa da chave permanente."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF##*/}"
          fi
          NAME="${TAG#v}"
          # versionCode = number of commits, matches gradle default.
          CODE=$(git rev-list --count HEAD)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          UPDATE_REPO_OWNER: ${{ github.repository_owner }}
          UPDATE_REPO_NAME: ${{ github.event.repository.name }}
          # Monetização (#29) — opcionais; vazios = sem anúncios / sem ativação Premium.
          LICENSE_API_URL: ${{ secrets.LICENSE_API_URL }}
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
          ADS_CONFIG_URL: ${{ secrets.ADS_CONFIG_URL }}
        run: |
          ARGS="-PVERSION_NAME=${{ steps.ver.outputs.name }} -PVERSION_CODE=${{ steps.ver.outputs.code }}"
          ARGS="$ARGS -PUPDATE_REPO_OWNER=$UPDATE_REPO_OWNER -PUPDATE_REPO_NAME=$UPDATE_REPO_NAME"
          [ -n "$LICENSE_API_URL" ] && ARGS="$ARGS -PLICENSE_API_URL=$LICENSE_API_URL"
          [ -n "$LICENSE_PUBLIC_KEY" ] && ARGS="$ARGS -PLICENSE_PUBLIC_KEY=$LICENSE_PUBLIC_KEY"
          [ -n "$ADS_CONFIG_URL" ] && ARGS="$ARGS -PADS_CONFIG_URL=$ADS_CONFIG_URL"
          if [ -n "$RELEASE_KEYSTORE_FILE" ]; then
            ARGS="$ARGS -PRELEASE_KEYSTORE_FILE=$RELEASE_KEYSTORE_FILE"
            ARGS="$ARGS -PRELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            ARGS="$ARGS -PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            ARGS="$ARGS -PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          fi
          ./gradlew :app:assembleRelease $ARGS --stacktrace

      # Confere que o APK saiu com a chave permanente (SHA-256 do certificado).
      - name: Verify signing certificate
        run: |
          EXPECTED="72FB7FA4E4B312D34988A28F23E826CE18E166AE6505E474A805907954EA99BD"
          unzip -o -q app/build/outputs/apk/release/app-release.apk 'META-INF/*.RSA' -d /tmp/apkcert
          ACTUAL=$(keytool -printcert -file /tmp/apkcert/META-INF/*.RSA             | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'a-f' 'A-F')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK assinado com certificado inesperado ($ACTUAL)."
            exit 1
          fi

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             tartatv-${{ steps.ver.outputs.name }}.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TartaTV ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: tartatv-${{ steps.ver.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
